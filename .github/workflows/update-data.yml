name: Update market data

on:
  schedule:
    # Three intraday snapshots on U.S. trading days (Mon-Fri). Times are UTC, so the
    # ET mapping drifts ~1h across DST; anchored so a run never fires before the 9:30
    # ET open and the close run is always at/after the 4 PM ET close.
    #   14:30 UTC  = 09:30 ET (EST) / 10:30 ET (EDT)  -> open / morning
    #   17:30 UTC  = 12:30 ET (EST) / 13:30 ET (EDT)  -> mid-day
    #   21:15 UTC  = 16:15 ET (EST) / 17:15 ET (EDT)  -> just after close
    - cron: '30 14 * * 1-5'
    - cron: '30 17 * * 1-5'
    - cron: '15 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate data.json
        run: python generate_data.py

      - name: Validate output
        run: |
          python <<'PY'
          import json, sys
          raw = open('data.json').read()
          # Reject NaN/Infinity the same way a browser's JSON.parse does — these are
          # valid to Python's lenient loader but blank the whole page in-browser.
          def _bad(tok):
              raise ValueError(f"non-finite token {tok!r} in data.json (browser JSON.parse would fail)")
          d = json.loads(raw, parse_constant=_bad)
          companies = d.get('companies', [])
          n = len(companies)
          td = d.get('trading_date')
          n_null = sum(1 for c in companies if c.get('change_pct') is None)
          print(f"trading_date={td}  companies={n}  null change_pct={n_null}")
          if n < 300:
              print(f"::error::Only {n} companies fetched (expected >=300). Refusing to commit.")
              sys.exit(1)
          if not td:
              print("::error::Missing trading_date. Refusing to commit.")
              sys.exit(1)
          if n_null > n * 0.5:
              print(f"::error::{n_null}/{n} companies have no change_pct (>50%). Likely a bad fetch. Refusing to commit.")
              sys.exit(1)
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          trading_date=$(python -c "import json; print(json.load(open('data.json')).get('trading_date') or 'unknown')")
          git commit -m "data: market close ${trading_date}"
          git push
